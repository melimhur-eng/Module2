<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Addis Market Shopping List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Addis Market Shopping List</h1>

  <form id="add-form">
    <input type="text" id="name" placeholder="Item name" />
    <input type="number" id="price" placeholder="Price (ETB)" />
    <button type="submit">Add item</button>
  </form>

  <ul id="list"></ul>

  <p>Total: <span id="total">0</span> ETB</p>

  <script src="app.js"></script>
</body>
</html>
